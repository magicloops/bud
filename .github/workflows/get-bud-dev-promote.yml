name: Promote get.bud.dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable GitHub Release version to promote, for example v0.1.0."
        required: true
      smoke:
        description: "Run deployed get.bud.dev smoke checks after Worker deploy."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ inputs.version }} to get.bud.dev
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "${VERSION}" \
            --pattern "manifest.${VERSION}.json" \
            --dir "dist/get-bud-dev"
          test -f "dist/get-bud-dev/manifest.${VERSION}.json"

      - name: Generate Worker promotion assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/bud-release.mjs promotion-assets \
            --manifest "dist/get-bud-dev/manifest.${VERSION}.json" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --assets-dir "deploy/get-bud-dev/assets"
          cat deploy/get-bud-dev/assets/releases/stable/manifest.json
          cat deploy/get-bud-dev/assets/_release-assets.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: deploy/get-bud-dev
          command: deploy

      - name: Smoke get.bud.dev
        if: ${{ inputs.smoke == true }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          curl -fsSI https://get.bud.dev
          root_script="$(mktemp)"
          trap 'rm -f "${root_script}"' EXIT
          curl -fsSL https://get.bud.dev -o "${root_script}"
          head -n 1 "${root_script}" | grep -Fx '#!/bin/sh'
          curl -fsSI https://get.bud.dev/install.sh
          curl -fsSI https://get.bud.dev/releases/stable/manifest.json
          # Worker version propagation to the edge is eventually consistent:
          # a single-shot check right after deploy has repeatedly caught the
          # PREVIOUS release. Poll until the new manifest version shows up.
          matched=""
          for attempt in $(seq 1 18); do
            served="$(curl -fsSL https://get.bud.dev/releases/stable/manifest.json \
              | node -e 'let d=""; process.stdin.on("data", c => d += c); process.stdin.on("end", () => { console.log(JSON.parse(d).version ?? ""); });')"
            if [ "${served}" = "${VERSION}" ]; then
              echo "stable manifest serves ${served} (attempt ${attempt})"
              matched="1"
              break
            fi
            echo "stable manifest still ${served:-<unparseable>} (want ${VERSION}); retrying in 10s (attempt ${attempt}/18)"
            sleep 10
          done
          if [ -z "${matched}" ]; then
            echo "stable manifest never converged on ${VERSION} within 3 minutes"
            exit 1
          fi
          curl -fsSI "https://get.bud.dev/releases/${VERSION}/bud-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSI "https://get.bud.dev/releases/${VERSION}/bud-aarch64-unknown-linux-gnu.tar.gz"
