name: Promote get.bud.dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable GitHub Release version to promote, for example v0.1.0."
        required: true

permissions:
  contents: read

concurrency:
  group: bud-release-publication
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.version }} to get.bud.dev
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            deploy/get-bud-dev/package-lock.json
            scripts/package-lock.json

      - name: Validate Worker delivery
        run: |
          npm ci --ignore-scripts --prefix deploy/get-bud-dev
          npm test --prefix deploy/get-bud-dev

      - name: Validate release tooling
        run: |
          npm ci --ignore-scripts --prefix scripts
          npm test --prefix scripts

      - name: Verify mirror and prepare stable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/bud-release-promote.mjs "$VERSION" deploy/get-bud-dev/assets

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: deploy/get-bud-dev
          command: deploy

      - name: Verify deployed release bytes and caching
        run: node scripts/bud-release-smoke.mjs deploy/get-bud-dev/assets/releases/stable/manifest.json
